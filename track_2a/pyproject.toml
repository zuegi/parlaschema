[project]
name = "openparl-extractor"
version = "0.1.0"
description = "Apertus-based extraction of Swiss parliamentary affairs into a common schema"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.9",
]

[project.scripts]
openparl-extractor = "openparl_extractor.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openparl_extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
