name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: track_2a
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.8.16"
          python-version: "3.12"
          working-directory: track_2a
          enable-cache: false
      - name: Install Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run tests
        run: uv run --frozen pytest -q
      - name: Build Docker image
        run: docker build -t openparl-extractor:ci .
      - name: Check CLI startup in Docker
        env:
          LLM_NAME: ci-placeholder
          LLM_BASE_URL: https://example.invalid/v1
          LLM_API_KEY: not-a-real-key
        run: |
          docker run --rm --network none \
            -e LLM_NAME -e LLM_BASE_URL -e LLM_API_KEY \
            openparl-extractor:ci check-config
